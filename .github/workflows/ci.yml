name: Kestrel CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Correctness gates run first so lint/type/test/build actually block merges.
      - name: Lint all workspaces
        run: npm run lint:all

      - name: Run unit and contract checks
        run: npm test

      - name: Build all workspaces
        run: npm run build:all

      - name: Run local API smoke checks
        run: npm run test:api

      # Advisory only: reported for visibility but does not block the pipeline, since
      # the known transitive advisories (e.g. elliptic via the Circle SDK) have no
      # upstream fix yet. Remediation is tracked separately, not gated on every run.
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=moderate || true
