name: Arc Suite Production Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: Send a test Slack/Sentry alert after a successful monitor run
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monitor production
        id: monitor
        shell: bash
        run: |
          set -o pipefail
          npm run monitor:prod 2>&1 | tee monitor-output.log

      - name: Notify monitor failure
        if: failure() && steps.monitor.outcome == 'failure'
        env:
          ARC_MONITOR_OUTPUT_FILE: monitor-output.log
          ARC_MONITOR_STATUS: failure
          ARC_SENTRY_DSN: ${{ secrets.ARC_SENTRY_DSN }}
          ARC_SENTRY_ENVIRONMENT: production
          ARC_SLACK_WEBHOOK_URL: ${{ secrets.ARC_SLACK_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-monitor.mjs

      - name: Send test alert
        if: success() && inputs.send_test_alert == true
        env:
          ARC_MONITOR_OUTPUT_FILE: monitor-output.log
          ARC_MONITOR_STATUS: test
          ARC_SENTRY_DSN: ${{ secrets.ARC_SENTRY_DSN }}
          ARC_SENTRY_ENVIRONMENT: production
          ARC_SLACK_WEBHOOK_URL: ${{ secrets.ARC_SLACK_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          cat > monitor-output.log <<'EOF'
          TEST alert delivery: manual workflow_dispatch requested send_test_alert=true
          {"durationMs":0,"failures":[{"name":"alert delivery test","message":"Manual test alert from Arc Suite Production Monitor workflow."}],"status":"test"}
          EOF
          node scripts/notify-monitor.mjs
