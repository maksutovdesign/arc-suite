name: Arc Suite Production Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monitor production
        id: monitor
        shell: bash
        run: |
          set -o pipefail
          npm run monitor:prod 2>&1 | tee monitor-output.log

      - name: Notify monitor failure
        if: failure() && steps.monitor.outcome == 'failure'
        env:
          ARC_MONITOR_OUTPUT_FILE: monitor-output.log
          ARC_MONITOR_STATUS: failure
          ARC_SENTRY_DSN: ${{ secrets.ARC_SENTRY_DSN }}
          ARC_SENTRY_ENVIRONMENT: production
          ARC_SLACK_WEBHOOK_URL: ${{ secrets.ARC_SLACK_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-monitor.mjs
