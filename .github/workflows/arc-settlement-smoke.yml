name: Arc Settlement Smoke

on:
  workflow_dispatch:
    inputs:
      recipient_address:
        description: Arc Testnet recipient EVM address
        required: true
        type: string
      amount_usdc:
        description: Testnet USDC amount to send
        required: false
        default: "0.003"
        type: string

jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run real Arc Testnet settlement smoke
        env:
          ARC_SETTLEMENT_SMOKE_API_KEY: ${{ secrets.ARC_MONITOR_API_KEY || secrets.ARC_API_KEY }}
          ARC_SETTLEMENT_SMOKE_BASE_URL: https://arcsuite-app.vercel.app
          ARC_SETTLEMENT_SMOKE_RECIPIENT: ${{ inputs.recipient_address }}
          ARC_SETTLEMENT_SMOKE_AMOUNT_USDC: ${{ inputs.amount_usdc }}
        run: node scripts/settlement-smoke.mjs
